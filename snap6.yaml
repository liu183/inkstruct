          - generic [ref=e388]:
            - paragraph [ref=e389]: 沈墨尘是被一阵剧痛唤醒的。
            - paragraph [ref=e390]: 后脑像是被人用铁锤砸过,喉咙里腥甜翻涌,他下意识伸手去摸,却摸到一手粘稠的、带着铁锈味的液体。不是水。是血。
            - paragraph [ref=e391]: 他猛地睁开眼,入目的却不是天花板,而是斑驳剥落的泥塑神像。残月从破败的屋顶漏进来,照着神像慈悲而空洞的脸,也照着他身上那件粗布短褐——宽大,粗糙,洗得发白,袖口还打着补丁。
            - paragraph [ref=e392]: 这不是他的床。他的床在城东那间三十平的出租屋里,闹钟是早上七点的手机铃声,窗外是永远堵着的车流。
            - paragraph [ref=e393]: 「你醒了。」一个苍老的声音在脑海里响起,带着千年尘封的沙哑。
            - paragraph [ref=e394]: 沈墨尘浑身汗毛倒竖,猛地翻身坐起,后脑的伤口扯得他龇牙咧嘴。他四下张望,古庙空无一人,只有香案上那尊神像的眼窝里,似乎有什么东西亮了一下。
            - paragraph [ref=e395]: 「不必找了,老夫在你识海深处。」那声音道,「小子,你姓甚名谁?」
            - paragraph [ref=e396]: 「我……」沈墨尘张了张嘴,「我叫沈墨尘。你又是谁?」
            - paragraph [ref=e397]: 「老夫是谁不重要。」声音顿了顿,「重要的是,你再不走,就要死在这了。」
            - paragraph [ref=e398]: "话音未落,庙门外传来凌乱的脚步声,夹杂着粗哑的呼喝:"
            - paragraph [ref=e399]: 「搜!那小子受了重伤跑不远,定在这山里!主人要的东西,就在他身上!」
            - paragraph [ref=e400]: 沈墨尘心里咯噔一声。这情景,这口吻,活脱脱就是三天前他熬夜追的那本《青云问道》里,血魔教追杀杂役弟子的桥段。
            - paragraph [ref=e401]: 而此刻,他就是那个被追杀的杂役。
