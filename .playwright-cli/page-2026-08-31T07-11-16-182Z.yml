              - paragraph [ref=e433]: 沈墨尘后背抵着冰冷的泥胎神像,胸口那道剑伤还在往外渗血。他忽然觉得有些荒诞——三天前他还在工位上为老板画饼,现在却要在破庙里跟一群邪修拼命。
              - paragraph [ref=e434]: 「小子,闭眼。」识海里那声音忽然沉了下来,「凝神,引气,入丹田。」
              - paragraph [ref=e435]: 沈墨尘不知道为什么自己要信一个素未谋面的声音,但他没有别的选择。他闭上眼,几乎是本能地,感受到体内有一股微弱的暖流在游走——那是穿越者附赠的、这具废柴身体里仅存的一缕灵气。
              - paragraph [ref=e436]: 「喝!」当先的血魔教弟子刀已劈到面门。
              - paragraph [ref=e437]: 就在这一瞬,沈墨尘猛地睁眼。右手不知何时握住了一柄锈迹斑斑的古剑——剑身上青色的纹路像是活过来一般,寸寸亮起!
              - paragraph [ref=e438]: 嗡——!
              - paragraph [ref=e439]: 剑鸣如龙吟,一道青色剑芒以沈墨尘为圆心横扫而出,破庙的泥胎神像从中裂开,三名血魔教弟子被剑气掀飞,撞在墙上,当场吐血!
              - paragraph [ref=e440]: 「这、这是……」当先那人脸色剧变,「是那把剑!快走——!」
              - paragraph [ref=e441]: 三人连滚带爬地遁入夜色,沈墨尘却再也撑不住,手中古剑当啷落地,人也软软地滑坐下去。
              - paragraph [ref=e442]: 「好小子。」识海里那声音笑了,「三天没吃饭,还能砍出这一剑,倒是个狠人。」
              - paragraph [ref=e443]: 「你……」沈墨尘咳出一口血,「你到底是谁?」
