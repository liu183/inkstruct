              - generic [ref=e579]:
                - paragraph [ref=e580]: "三道人影鱼贯而入,当先一人面色惨白,瞳孔泛着血色,正是血魔教的标志。他手里一柄弯刀在月光下泛着寒光,目光扫过沈墨尘,忽然咧嘴笑了:"
                - paragraph [ref=e581]: 「果然在这。小子,识相的就把那东西交出来,本座留你全尸。」
                - paragraph [ref=e582]: 沈墨尘后背抵着冰冷的泥胎神像,胸口那道剑伤还在往外渗血。他忽然觉得有些荒诞——三天前他还在工位上为老板画饼,现在却要在破庙里跟一群邪修拼命。
                - paragraph [ref=e583]: 「小子,闭眼。」识海里那声音忽然沉了下来,「凝神,引气,入丹田。」
                - paragraph [ref=e584]: 沈墨尘不知道为什么自己要信一个素未谋面的声音,但他没有别的选择。他闭上眼,几乎是本能地,感受到体内有一股微弱的暖流在游走——那是穿越者附赠的、这具废柴身体里仅存的一缕灵气。
                - paragraph [ref=e585]: 「喝!」当先的血魔教弟子刀已劈到面门。
                - paragraph [ref=e586]: 就在这一瞬,沈墨尘猛地睁眼。右手不知何时握住了一柄锈迹斑斑的古剑——剑身上青色的纹路像是活过来一般,寸寸亮起!
                - paragraph [ref=e587]: 嗡——!
                - paragraph [ref=e588]: 剑鸣如龙吟,一道青色剑芒以沈墨尘为圆心横扫而出,破庙的泥胎神像从中裂开,三名血魔教弟子被剑气掀飞,撞在墙上,当场吐血!
                - paragraph [ref=e589]: 「这、这是……」当先那人脸色剧变,「是那把剑!快走——!」
                - paragraph [ref=e590]: 三人连滚带爬地遁入夜色,沈墨尘却再也撑不住,手中古剑当啷落地,人也软软地滑坐下去。
                - paragraph [ref=e591]: 「好小子。」识海里那声音笑了,「三天没吃饭,还能砍出这一剑,倒是个狠人。」
                - paragraph [ref=e592]: 「你……」沈墨尘咳出一口血,「你到底是谁?」
                - paragraph [ref=e593]: 「老夫乃剑阁守门人。」声音淡淡道,「小子,记住,这把剑叫——无名。它认了你,你便再也甩不掉它了。」
